<script>
(function () {
  const svg = document.getElementById("fig");
  const kit = createFigureKit(svg, rough.svg(svg));
  // Whatever stops the spec (a syntax error leaves FIGURE undefined, a typo in a kind or a
  // helper not destructured throws in draw) goes into the layout report, not only the console.
  let drawError = null;
  try {
    // A translated edition sets FIGURE.lang (for example "vi") for screen readers and hyphenation.
    document.documentElement.lang = FIGURE.lang || "en";
    document.title = FIGURE.title;
    document.querySelector("h1").textContent = FIGURE.title;
    document.querySelector(".sub").textContent = FIGURE.subtitle;
    svg.setAttribute("aria-label", FIGURE.title);
    svg.setAttribute("viewBox", "0 0 " + FIGURE.width + " " + FIGURE.height);
    FIGURE.draw(kit);
  } catch (error) {
    drawError = String(error);
  }
  // The layout check measures text, so it waits until the font is in use.
  const family = "__FONT_FAMILY__";
  function finish() {
    const faces = [...document.fonts].filter((f) => f.family.replace(/["']/g, "") === family);
    kit.finish(faces.length > 0 && faces.every((f) => f.status === "loaded"), drawError);
  }
  document.fonts.load('20px "' + family + '"').then(finish, finish);
})();
</script>
