# Strict mypy settings behind cv-kit's Python rules. For a library without type stubs, add a
# [mypy-<package>.*] section with ignore_missing_imports = True rather than loosening strict.
[mypy]
python_version = 3.10
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, possibly-undefined
