name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      # The versions the shipped lint configs were tested with (tests/test_lint_configs.py); cmake and g++ come
      # with the runner.
      - run: pip install ruff==0.17.2 mypy==2.4.0 clang-format==23.1.3 clang-tidy==23.1.3
      - run: npm install -g @anthropic-ai/claude-code
      - run: python scripts/validate_plugin.py
      - run: python -m pytest tests -q
      - run: claude plugin validate . --strict
      - run: claude plugin validate .claude-plugin/plugin.json --strict
      - run: claude plugin validate skills --strict
      - run: claude plugin validate agents --strict
      # Every template as a PNG, to look at in a pull request without building it locally.
      - name: Render figure templates
        if: always()
        run: |
          mkdir -p figure-templates
          for spec in skills/ai-workflow-figure/templates/*.figure.js; do
            name=$(basename "$spec" .figure.js)
            python skills/ai-workflow-figure/scripts/build_figure.py "$spec" "figure-templates/$name.html"
            python skills/ai-workflow-figure/scripts/check_figure.py "figure-templates/$name.html" \
              --png "figure-templates/$name.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-templates
          path: figure-templates/*.png
          retention-days: 14
